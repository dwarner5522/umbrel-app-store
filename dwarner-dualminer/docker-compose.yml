version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dwarner-dualminer_app_1
      APP_PORT: 8080

  # The panel is the stdlib-only Python in ./app, run on a stock Python image
  app:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 10s
    command: ["python", "-u", "/app/server.py"]
    volumes:
      - ${APP_DATA_DIR}/app:/app:ro
      - ${APP_DATA_DIR}/data/panel:/data # the list of boards and the shared token
    environment:
      PORT: "8080"
      DATA_DIR: /data
