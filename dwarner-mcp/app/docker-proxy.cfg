# Filters the Docker socket down to what the MCP server uses: listing containers,
# their state, logs and stats, and starting, stopping or restarting one.
# Everything else, such as creating containers, exec or reading files, is refused,
# so the socket can't be used to take over the Umbrel.
# It listens on a unix socket in this app's own data folder, not on the network.

global
    log stdout format raw daemon warning
    maxconn 200

defaults
    mode http
    log global
    option http-server-close
    timeout connect 10s
    timeout client 2m
    timeout server 2m
    timeout http-request 10s

frontend docker
    bind /docker-proxy/docker.sock mode 600 uid 1000 gid 1000

    acl read_path path,url_dec -m reg ^(/v[0-9.]+)?/(_ping|version|containers/json)$
    acl read_container path,url_dec -m reg ^(/v[0-9.]+)?/containers/[A-Za-z0-9][A-Za-z0-9_.-]*/(json|logs|stats)$
    acl control_container path,url_dec -m reg ^(/v[0-9.]+)?/containers/[A-Za-z0-9][A-Za-z0-9_.-]*/(start|stop|restart)$

    http-request allow if METH_GET read_path
    http-request allow if METH_GET read_container
    http-request allow if METH_POST control_container
    http-request deny deny_status 403

    default_backend docker_socket

backend docker_socket
    server docker /var/run/docker.sock
