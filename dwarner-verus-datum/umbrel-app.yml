          text: "21.4"
          subtext: "MH/s"
        - title: "Miners"
          text: "4"
          subtext: "online"
        - title: "Blocks found"
          text: "1"
          subtext: "blocks"
        - title: "Time to block"
          text: "12.5"
          subtext: "days"
submitter: dwarner5522
submission: https://github.com/dwarner5522/umbrel-app-store
