manifestVersion: 1.1
id: dwarner-core-lightning
implements:
  - core-lightning
category: bitcoin
name: Core Lightning (blake2b)
icon: https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/refs/heads/master/core-lightning/icon.svg
version: "26.06.7-patch.6"
tagline: Run your personal Core Lightning node
description: >-
  Needs Bitcoin Knots or Knots (BLAKE2b) Companion, chosen when you install
  it or later in its settings. It will not connect to Bitcoin Node or any other
  Bitcoin node.


  Get started with the Lightning network today with Core Lightning - a
  Lightning Network implementation focusing on spec compliance and performance.


  The Lightning Network allows ultra cheap and almost instant Bitcoin transactions.
  By running a Lightning node, you can not only self-custody your Bitcoin on
  Lightning, but also earn sats by routing payments on the network.


  Core Lightning and Application powered by Blockstream.

developer: Core Lightning
website: https://blockstream.com/lightning/
dependencies:
  - bitcoin
repo: https://github.com/privkeyio/lightning
support: https://community.corelightning.org/home
port: 2103
gallery:
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/refs/heads/master/core-lightning/1.jpg
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/refs/heads/master/core-lightning/2.jpg
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/refs/heads/master/core-lightning/3.jpg
path: ""
defaultPassword: ""
submitter: Blockstream
submission: https://github.com/getumbrel/umbrel-apps/pull/475
releaseNotes: >-
  Fixes the app page not loading. This Core Lightning build only accepts
  connections from peers that support BLAKE2b, and the web app's own
  connection did not, so it was dropped straight away. The web app now talks
  to Core Lightning over its REST interface instead, and is updated to 26.09.


  In Connect Wallet, the REST (local) address shows as "cln": use
  umbrel.local in its place when connecting a wallet on another device.


  Choose Bitcoin Knots or Knots (BLAKE2b) Companion as the Bitcoin node.
  If you installed a version before 26.06.7-patch.4, open this app's settings
  and select the node it should use.
backupIgnore:
  - data/lightningd/bitcoin/lightningd.sqlite3
