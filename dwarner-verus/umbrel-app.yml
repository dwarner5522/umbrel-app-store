manifestVersion: 1
id: dwarner-verus
storage:
  dataRoot: data
category: verus-coin
name: Verus Node
version: "1.2.18-6"
tagline: Run your personal Verus node, Electrum server and PBaaS chains
description: >-
  Run your own Verus (VRSC) full node, powered by the official Verus daemon (verusd). Independently store and validate every Verus block and transaction,
  and connect your wallets, miners, and other software directly to your own node instead of trusting someone else's.


  The app shows your node's sync progress, peers, network hashrate, and blockchain size at a glance, along with the RPC and P2P details you need to connect to it.


  It also includes your own Electrum server, so lite wallets such as Verus Desktop can look up your addresses and balances on your node instead of a public server.
  Add the server address shown in the app as a custom Electrum server for VRSC in your wallet. The first index takes several hours and starts once the node has synced.
  The Electrum server uses plain TCP on port 17485 on your local network. It is not encrypted, so do not forward that port on your router.


  You can also run other chains of the Verus network next to VRSC (vARRR, vDEX, CHIPS) and merge mine them: each has a switch in the app.
  With merge mining on, whoever mines VRSC through your node, for example with the Verus Datum app, mines those chains with the same hashes.
  Every chain is a full node of its own. It starts from a signed bootstrap from bootstrap.verus.expert, the chains sync one at a time,
  and they run at a lower priority than the rest of your Umbrel. Each still needs memory and several gigabytes of storage while it runs.


  On first start the app downloads the zk-SNARK parameters Verus needs (about 780 MB, one time) and then begins syncing the blockchain.
  A full sync from the first block can take days. To get going faster, use "Sync from bootstrap" in the app to download a recent copy of the blockchain published by the Verus project (about 25 GB).


  The Verus daemon needs at least 4 GB of free memory and around 60 GB of storage. The Electrum server needs several gigabytes more.


  To accept incoming connections from other Verus nodes, forward port 27485 on your router to your Umbrel.


  This is a community package and is not maintained by the Verus Coin Foundation. It runs the unmodified official verusd release,
  and ElectrumX with Verus support from the Verus developers.
releaseNotes: >-
  PBaaS chains now use far fewer resources while they get going:


  - A chain switched on for the first time starts from a bootstrap from bootstrap.verus.expert instead of verifying every block on your Umbrel.
    Each bootstrap is checked against its publisher's VerusID signature before it is installed. A Bootstrap button loads a fresh one at any time.

  - Chains download and sync one at a time, and run at a lower CPU and disk priority than everything else on your Umbrel.

  - Smaller settings for each chain: fewer peers, a smaller cache and one verification thread.

  - If a chain starts mining on your Umbrel's CPU (which happens when it loses its connection to VRSC), its merge mining is paused for 15 minutes.


  A chain that was already syncing keeps its data. To switch it to a bootstrap, press Bootstrap next to it.
  The Verus daemon is unchanged (v1.2.18). Your node restarts during the update and keeps its blockchain, wallet and Electrum index.
developer: Verus Coin Foundation
website: https://verus.io
dependencies: []
repo: https://github.com/dwarner5522/umbrel-verus
support: https://github.com/dwarner5522/umbrel-verus/issues
port: 2113
gallery: []
path: ""
icon: https://raw.githubusercontent.com/dwarner5522/umbrel-verus/HEAD/icon.svg
defaultUsername: ""
defaultPassword: ""
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "5s"
    endpoint: "app:3000/api/widget/stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Connections"
          text: "16"
          subtext: "peers"
        - title: "Mempool"
          text: "12"
          subtext: "txs"
        - title: "Hashrate"
          text: "1.1"
          subtext: "TH/s"
        - title: "Blockchain size"
          text: "32"
          subtext: "GB"
  - id: "sync"
    type: "text-with-progress"
    refresh: "2s"
    endpoint: "app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "Blockchain sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
  - id: "electrum"
    type: "text-with-progress"
    refresh: "5s"
    endpoint: "app:3000/api/widget/electrum"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "Electrum server"
      text: "83%"
      progressLabel: "Indexing"
      progress: 0.83
backupIgnore:
  - data/electrumx/db
  - data/verus/.komodo/VRSC/blocks
  - data/verus/.komodo/VRSC/chainstate
  - data/verus/.komodo/VRSC/VRSC-bootstrap.tar.gz
  - data/verus/.zcash-params
submitter: dwarner5522
submission: https://github.com/dwarner5522/umbrel-app-store
