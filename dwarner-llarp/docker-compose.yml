version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dwarner-llarp_web_1
      APP_PORT: 7090

  # The control page: passes the app proxy's requests on to the node service's unix socket,
  # so the page is only reachable through the Umbrel login
  web:
    image: ghcr.io/dwarner5522/llarp-umbrel:1.0.0@sha256:c8fcf1ec3b9fef23234f709b5a96ed075b5eccbe527aba447fa8abce11c7df59
    init: true
    restart: on-failure
    stop_grace_period: 5s
    command: ["/app/umbrel_bridge.py"]
    volumes:
      - ${APP_DATA_DIR}/data:/data

  # llarpd and its control service, on the host network: as a router it listens on UDP 1090,
  # as a client it creates the llarp-umbrel tunnel interface and a firewall table for it
  node:
    image: ghcr.io/dwarner5522/llarp-umbrel:1.0.0@sha256:c8fcf1ec3b9fef23234f709b5a96ed075b5eccbe527aba447fa8abce11c7df59
    network_mode: host
    init: true
    restart: on-failure
    stop_grace_period: 30s
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${APP_DATA_DIR}/data:/data
